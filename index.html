<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA STUDIOS | Digital Store</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #121215;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Ambient Background Glow (2D) --- */
        .ambient-glow {
            position: fixed;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 50vh;
            background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Top Stats Bar --- */
        .top-stats-bar {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 8px 5%; background-color: #000000;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; color: var(--text-muted);
            z-index: 101;
        }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item i { color: var(--accent-blue); text-shadow: 0 0 8px var(--accent-glow); }

        /* --- Navigation --- */
        .navbar {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); z-index: 100; gap: 15px;
        }

        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); text-shadow: 0 0 15px var(--accent-glow); }

        .search-container { flex-grow: 1; position: relative; max-width: 400px; }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;}
        .search-container input {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 50px;
            background: #18181b; border: 1px solid var(--border-color); color: white;
            font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s ease;
        }
        .search-container input:focus { border-color: var(--accent-blue); background: #1f1f23; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .contact-btn {
            font-size: 0.9rem; color: var(--text-muted); text-decoration: none; font-weight: 500;
            display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: color 0.3s;
        }
        .contact-btn:hover { color: white; }

        /* --- Hero Section --- */
        .hero { text-align: center; padding: 60px 20px 40px; max-width: 800px; margin: 0 auto; }
        .badge {
            display: inline-block; padding: 6px 16px; border-radius: 50px;
            background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase;
        }
        .hero h2 { 
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); 
            font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1px;
        }
        .hero h2 span { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto; }

        /* --- Product Grid --- */
        .grid { 
            display: grid; grid-template-columns: 1fr; 
            gap: 25px; max-width: 1200px; margin: 0 auto 80px; padding: 0 20px; width: 100%; flex-grow: 1;
        }

        /* --- Modern Flat Cards --- */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; 
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .image-wrapper { width: 100%; height: 200px; overflow: hidden; border-bottom: 1px solid var(--border-color); position: relative; }
        .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }

        .share-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: background 0.2s;
        }
        .share-btn:hover { background: var(--accent-blue); }

        .card-content { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }
        .card h3 { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0 0 10px 0; font-size: 1.3rem; font-weight: 700; }
        .description { 
            color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .price { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: white; font-size: 1.6rem; }

        /* Flat Button */
        .buy-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--accent-blue); color: white; padding: 14px 24px; text-decoration: none; 
            border-radius: 50px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; 
            font-size: 0.95rem; transition: all 0.3s ease; 
        }
        .buy-btn:hover { background: #2563eb; box-shadow: 0 0 20px var(--accent-glow); }

        /* --- Empty State --- */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--border-color); }

        /* --- Footer --- */
        .footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border-color); background: #09090b; }
        .footer p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        
        .footer a.wa-link {
            display: inline-flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-weight: 600;
            padding: 12px 24px; border-radius: 50px; background: rgba(37, 211, 102, 0.1); border: 1px solid rgba(37, 211, 102, 0.3); 
            transition: background 0.3s;
        }
        .footer a.wa-link:hover { background: rgba(37, 211, 102, 0.2); }
        .footer a.wa-link i { color: #25D366; font-size: 1.2rem; }

        /* --- Floating Contact Button --- */
        .floating-contact {
            position: fixed; bottom: 20px; right: 20px; background: var(--accent-blue); color: white;
            width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); z-index: 1000;
            transition: transform 0.3s, background 0.3s; text-decoration: none; border: 2px solid rgba(255,255,255,0.2);
        }
        .floating-contact:hover { transform: scale(1.1); background: #2563eb; }

        /* --- Desktop Enhancements --- */
        @media (min-width: 768px) {
            .navbar { padding: 20px 5%; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
            .card-image { height: 220px; }
            
            .card:hover { transform: translateY(-8px); border-color: #3f3f46; box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(59, 130, 246, 0.1); }
            .card:hover .card-image { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="top-stats-bar">
        <div class="stat-item" id="product-counter">
            <i class="fa-solid fa-box"></i> Loading...
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">NEX<span>O</span>RA</div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search digital products...">
        </div>
        <a href="mailto:nexorastudio5656@gmail.com" class="contact-btn">
            <i class="fa-regular fa-envelope"></i> Contact
        </a>

    <section class="hero">
        <div class="badge">Nexora Studios</div>
        <h2>Ideas. Designed <span>Digitally.</span></h2>
        <p>Premium digital assets and tools curated for creators, students, and professionals.</p>

    <div class="grid" id="product-grid">
        <div class="skeleton-card" style="height:380px; background:#121215; border-radius:20px; animation: pulse 1.5s infinite;"></div>
        <div class="skeleton-card" style="height:380px; background:#121215; border-radius:20px; animation: pulse 1.5s infinite; animation-delay: 0.2s;"></div>
    </div>

    <!-- UPDATED FOOTER: Removed email and phone number -->

        <a href="https://whatsapp.com/channel/0029Vb8TEO2FSAt0DnFycN0c" target="_blank" class="wa-link">

        </a>

    <!-- Floating Contact Button (Kept this so they can still call you easily) -->
    <a href="tel:+2349022077839" class="floating-contact">
        <i class="fa-solid fa-phone"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
