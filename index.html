<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA STUDIOS | Digital Store</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050508;
            --card-bg: rgba(20, 20, 25, 0.9);
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.6);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            perspective: 1200px; /* Global 3D Perspective */
        }

        /* --- 3D Background Depth Elements --- */
        .bg-grid {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateZ(-200px);
            z-index: -2;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateZ(-200px) translateY(0); }
            100% { transform: rotateX(60deg) translateZ(-200px) translateY(50px); }
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.4;
            animation: floatOrb 10s infinite ease-in-out alternate; transform: translateZ(-100px);
        }
        .orb-1 { width: 300px; height: 300px; background: #3b82f6; top: 10%; left: -10%; }
        .orb-2 { width: 250px; height: 250px; background: #8b5cf6; bottom: 20%; right: -10%; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translateZ(-100px) translate(0, 0) scale(1); }
            100% { transform: translateZ(-100px) translate(30px, 30px) scale(1.2); }
        }

        /* --- Top Stats Bar --- */
        .top-stats-bar {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 8px 5%; background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; color: var(--text-muted);
            z-index: 101; transform: translateZ(50px);
        }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item i { color: var(--accent-blue); text-shadow: 0 0 10px var(--accent-glow); }

        /* --- Navigation --- */
        .navbar {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 8, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); z-index: 100; gap: 15px;
            transform: translateZ(60px); 
        }

        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); text-shadow: 0 0 15px var(--accent-glow); }

        .search-container { flex-grow: 1; position: relative; max-width: 400px; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;}
        .search-container input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 50px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white;
            font-size: 0.85rem; font-family: 'Inter', sans-serif; outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }
        .search-container input:focus { border-color: var(--accent-blue); background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 2px 5px rgba(0,0,0,0.5); }

        .contact-btn {
            font-size: 0.85rem; color: var(--text-muted); text-decoration: none; font-weight: 600;
            display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: color 0.3s;
        }
        .contact-btn:hover { color: white; }

        /* --- Hero Section --- */
        .hero { text-align: center; padding: 60px 20px 40px; max-width: 800px; margin: 0 auto; transform-style: preserve-3d; }
        .badge {
            display: inline-block; padding: 6px 14px; border-radius: 50px;
            background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase;
            transform: translateZ(40px); 
        }
        .hero h2 { 
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.2rem, 6vw, 3.5rem); 
            font-weight: 800; line-height: 1.1; margin-bottom: 15px;
            transform: translateZ(60px); text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .hero h2 span { background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; max-width: 400px; margin: 0 auto; transform: translateZ(30px); }

        /* --- 3D Product Grid --- */
        .grid { 
            display: grid; grid-template-columns: 1fr; 
            gap: 30px; max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; width: 100%; flex-grow: 1;
            perspective: 1000px; transform-style: preserve-3d;
        }

        /* --- Cards & Assembly Animation --- */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; 
            display: flex; flex-direction: column; position: relative;
            transform-style: preserve-3d; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateZ(-800px) translateY(100px) rotateX(45deg);
            animation: assembleCard 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes assembleCard {
            0% { opacity: 0; transform: translateZ(-800px) translateY(100px) rotateX(45deg) scale(0.5); }
            100% { opacity: 1; transform: translateZ(0) translateY(0) rotateX(0) scale(1); }
        }

        .card:active { transform: scale(0.97) translateZ(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.8); transition: transform 0.1s; }

        .image-wrapper { 
            width: 100%; height: 200px; overflow: hidden; border-radius: 20px 20px 0 0; 
            position: relative; border-bottom: 1px solid var(--border-color); transform: translateZ(20px); 
        }
        .card-image { width: 100%; height: 100%; object-fit: cover; }

        .image-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        /* Share Button */
        .share-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transform: translateZ(40px);
            transition: background 0.2s;
        }
        .share-btn:active { background: var(--accent-blue); }

        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; transform: translateZ(30px); }
        .card h3 { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 800; }
        .description { 
            color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .price { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #60a5fa; font-size: 1.5rem; text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* 3D Push Button */
        .buy-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 14px; 
            text-decoration: none; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; 
            font-weight: 800; font-size: 0.95rem; letter-spacing: 1px;
            transition: all 0.1s ease; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 0 #1e40af, 0 8px 15px rgba(0,0,0,0.4); 
        }

        .buy-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #1e40af, 0 2px 5px rgba(0,0,0,0.4); }

        /* --- Empty State --- */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--border-color); }

        /* --- Footer --- */
        .footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.5); transform: translateZ(20px); }
        .footer p { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px; }
        .footer a {
            display: inline-flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-weight: 600;
            padding: 12px 24px; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: background 0.3s;
        }
        .footer a:active { background: rgba(255,255,255,0.1); }
        .footer a i { color: #25D366; font-size: 1.2rem; }

        /* --- Desktop Enhancements --- */
        @media (min-width: 768px) {
            .navbar { padding: 20px 5%; }
            .logo { font-size: 1.5rem; }
            .search-container { max-width: 400px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); perspective: 1500px; }
            .card-image { height: 220px; }
            .card h3 { font-size: 1.4rem; }
            .price { font-size: 1.8rem; }
            
            .card:hover { 
                box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(59, 130, 246, 0.2); 
                border-color: rgba(59, 130, 246, 0.5);
                transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .share-btn:hover { background: var(--accent-blue); transform: translateZ(50px) scale(1.1); }
        }
    </style>
</head>
